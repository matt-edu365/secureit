<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteRule "^/(?!auth(?:/|$)|admin(?:/|$)|control-details(?:/|$)|control-remediation(?:/|$)|dashboard(?:/|$)|diagnostics(?:/|$)|keyvault(?:/|$)|login(?:/|$)|logout(?:/|$)|onboard(?:/|$)|report-asset(?:/|$)|report-diagnostics(?:/|$)|report-download(?:/|$)|report-import(?:/|$)|runtime-diagnostics(?:/|$)|tenant(?:/|$)|workflow-sync(?:/|$))([a-z0-9-]+)/(.*)$" "/report-asset.php?tenant=$1&path=$2" [B,END]

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
